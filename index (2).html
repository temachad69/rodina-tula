<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Родина · Тула</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Unbounded', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: linear-gradient(160deg, #f5f0e8 0%, #ede4d3 50%, #e0d5c0 100%);
    }

    /* ── Карточка ── */
    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      padding: 40px 28px 36px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(100, 80, 40, 0.15), 0 2px 8px rgba(0,0,0,0.05);
      animation: fadeUp 0.65s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Логотип ── */
    .logo-wrap {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 22px;
      border: 2px solid rgba(160, 120, 60, 0.25);
      box-shadow: 0 4px 24px rgba(100, 70, 20, 0.12);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Название ── */
    .business-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #1a1208;
      margin-bottom: 7px;
      letter-spacing: -0.3px;
      line-height: 1.25;
    }

    .tagline {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 400;
      color: #9a8570;
      margin-bottom: 26px;
      line-height: 1.7;
      letter-spacing: 0.3px;
    }

    /* ── NFC-бейдж ── */
    .nfc-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(180, 140, 80, 0.09);
      border: 1px solid rgba(180, 140, 80, 0.22);
      border-radius: 20px;
      padding: 6px 15px;
      font-family: 'Unbounded', sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: #8a6830;
      margin-bottom: 26px;
      letter-spacing: 0.3px;
    }

    .nfc-dot {
      width: 6px;
      height: 6px;
      background: #5cb85c;
      border-radius: 50%;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.7); }
    }

    /* ── Заголовок секции ── */
    .section-label {
      font-family: 'Unbounded', sans-serif;
      font-size: 8px;
      font-weight: 600;
      color: #b8a898;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: left;
    }

    /* ── Кнопки ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.2px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    }

    .btn:active { transform: scale(0.97); }

    .btn .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.2);
    }

    .btn .label { flex: 1; text-align: left; }
    .btn .arrow { font-size: 14px; opacity: 0.55; }

    .btn-review    { background: linear-gradient(135deg, #e8410a, #ff6b35); }
    .btn-instagram { background: linear-gradient(135deg, #833ab4, #e1306c, #f77737); }
    .btn-vk        { background: linear-gradient(135deg, #2787F5, #1a6fd4); }

    /* ── Разделитель ── */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(180,140,80,0.18), transparent);
      margin: 2px 0 20px;
    }

    /* ── Подвал ── */
    .footer {
      margin-top: 22px;
      font-family: 'Unbounded', sans-serif;
      font-size: 8px;
      font-weight: 400;
      color: #c8b898;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="logo-wrap">
      <img src="logo.jpg" alt="Родина — логотип" 
           onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:52px;\'>🇷🇺</span>';" />
    </div>

    <h1 class="business-name">Родина · Тула</h1>
    <p class="tagline">Уличная одежда · Отечественные бренды · Осн. 2014</p>

    <div class="nfc-badge">
      <span class="nfc-dot"></span>
      Вы отсканировали NFC‑метку
    </div>

    <div class="section-label">⭐ Оставить отзыв</div>
    <div class="btn-group">
      <a class="btn btn-review"
         href="https://yandex.ru/maps/org/rodina/158195083879/?ll=37.616944%2C54.197508&z=14"
         target="_blank" rel="noopener">
        <span class="icon"><i class="fa-solid fa-star"></i></span>
        <span class="label">Отзыв на Яндекс.Картах</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <div class="divider"></div>

    <div class="section-label">📲 Мы в соцсетях</div>
    <div class="btn-group">
      <a class="btn btn-instagram"
         href="https://www.instagram.com/rodina_tula?igsh=aDlsYnRmb3dleThq"
         target="_blank" rel="noopener">
        <span class="icon"><i class="fa-brands fa-instagram"></i></span>
        <span class="label">Instagram</span>
        <span class="arrow">›</span>
      </a>
      <a class="btn btn-vk"
         href="https://vk.ru/rodinavtule"
         target="_blank" rel="noopener">
        <span class="icon"><i class="fa-brands fa-vk"></i></span>
        <span class="label">ВКонтакте</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <div class="footer">РОДИНА · ТУЛА · С 2014</div>
  </div>
</body>
</html>
